query QueryWorkflow($input: QueryRequest) {
    queryWorkflow(input: $input) {
        paymentId,
        value,
        authorizationToken,
        authorization { token, value, approved }
        applicationMutation1 { value },
        applicationMutation2 { value },
        compensation { value },
        reply { value},
        beginning { value },
        finalizable,
        finalization { value }
    }
}