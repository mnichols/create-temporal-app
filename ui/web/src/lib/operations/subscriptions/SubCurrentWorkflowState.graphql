subscription SubCurrentPaymentState($input: WorkflowStateRequest!) {
    workflowState(input: $input) {
        accountId,
        paymentId,
        value,
        authorization { token, approved },
        applicationMutation1 { value },
        applicationMutation2 { value },
        compensation { value },
        beginning { value },
        finalizable,
        finalization { value }
    }
}