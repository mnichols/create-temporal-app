type TemporalConnection {
    namespace: String!
    taskQueue: String
}
type AppInfo {
    temporal: TemporalConnection!
    name: String!
}

type CurrentWorkflowState {
    value: String!
    validation: ValidateResponse
    applicationMutation1: MutateApplicationResponse
    applicationMutation2: MutateApplicationResponse
    compensation: CompensateResponse
    reply: ReplyResponse
    beginning: BeginResponse
    finalizable: String
    finalization: FinalizeResponse
    workflowId: String!
}

input ExecuteWorkflowRequest {
    workflowId: String!
    value: String!
    reply: ReplyRequest
}

input ValidateRequest {
    value: String!
}
type ValidateResponse {
    value: String!
}

input MutateApplicationRequest {
    value: String!
}
type MutateApplicationResponse {
    value: String!
}

input CompensateRequest {
    value: String!
}
type CompensateResponse {
    value: String!
}

input ReplyRequest {
    value: String!
    taskQueue: String!
    activityName: String!
}
type ReplyResponse {
    workflowId: String!
    id: String!
    value: String!
}

input BeginRequest {
    value: String!
}
type BeginResponse {
    value: String!
}

input MarkFinalizableRequest {
    value: String!
}
input FinalizeRequest {
    workflowId: String!
    value: String!
}
type FinalizeResponse {
    workflowId: String!
    value: String!
}

input QueryRequest {
    workflowId: String!
    value: String
}
type QueryResponse {
    workflowId: String!
    value: String!
}

type Mutation {
    executeWorkflow(input: ExecuteWorkflowRequest!): ReplyResponse!
    markFinalizable(input: MarkFinalizableRequest!): FinalizeResponse!
}
type Query {
    appInfo: AppInfo!
    queryWorkflow(input: QueryRequest): CurrentWorkflowState!
}